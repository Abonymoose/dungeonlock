<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#131515">
<title>Dungeonlock</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* --u is one art pixel in CSS px, set from JS so the UI scales with the game */
  :root { --sand: #E7D6BC; --oak: #D4C5AC; --crimson: #9B1C1C; --choc: #6E2323; --onyx: #131515; --u: 2px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--onyx); color: var(--sand);
    font-family: 'Press Start 2P', monospace; font-size: calc(var(--u) * 4); line-height: 1.7; user-select: none;
    touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none;
  }
  .codex, .settings { touch-action: pan-y; }
  canvas { display: block; image-rendering: pixelated; }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 45%, var(--onyx) 100%);
  }
  .hidden { display: none !important; }
  .panel { background: var(--onyx); border: var(--u) solid var(--choc); padding: calc(var(--u) * 4) calc(var(--u) * 5); }
  .btn {
    display: inline-block; min-width: 2.2em; padding: 0 0.4em; text-align: center;
    background: var(--sand); color: var(--onyx); margin-right: 0.6em;
  }
  .dim { color: var(--oak); opacity: 0.7; }
  .red { color: var(--crimson); }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .ftext {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    text-shadow: var(--u) var(--u) 0 var(--onyx), calc(var(--u) * -1) calc(var(--u) * -1) 0 var(--onyx);
  }
  .ftext.crit { font-size: 1.5em; }
  .ftext.hurt { color: var(--crimson); text-shadow: var(--u) var(--u) 0 var(--sand); }
  .ftext.ash { color: var(--oak); font-size: 0.8em; }

  /* HUD, Hades-style: vitals bottom-left, boon slots down the left edge, resources top-right, no ability boxes */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; text-shadow: var(--u) var(--u) 0 var(--onyx); }
  .frame { box-shadow: 0 0 0 var(--u) var(--onyx), 0 0 0 calc(var(--u) * 2) var(--choc), 0 0 0 calc(var(--u) * 3) var(--onyx); }
  .vitals { position: absolute; left: calc(var(--u) * 10); bottom: calc(var(--u) * 10); }
  .pips { display: flex; gap: calc(var(--u) * 6); margin: 0 0 calc(var(--u) * 4) calc(var(--u) * 1); min-height: calc(var(--u) * 8); }
  .ammo, .lives { display: flex; gap: calc(var(--u) * 2); }
  .pip.life { background: var(--crimson); box-shadow: inset 0 0 0 var(--u) var(--sand); }
  .xpwrap { display: flex; align-items: center; gap: calc(var(--u) * 4); margin-top: calc(var(--u) * 4); }
  .xp { width: calc(var(--u) * 120); height: calc(var(--u) * 2); background: var(--onyx); box-shadow: 0 0 0 var(--u) var(--onyx); }
  .xp i { display: block; height: 100%; background: var(--oak); }
  .lv { font-size: 0.6em; color: var(--oak); }
  .patron h2 { color: var(--c); text-shadow: calc(var(--u) * 2) calc(var(--u) * 2) 0 var(--onyx); }
  .card.boon { border-color: var(--c); opacity: 0.6; min-height: calc(var(--u) * 80); }
  .card.boon.sel { opacity: 1; box-shadow: 0 0 calc(var(--u) * 8) var(--c); border-color: var(--r); }
  .card.boon .kind { font-size: 0.6em; color: var(--c); margin-bottom: 0.8em; letter-spacing: 0.1em; }
  .card.boon .rar { font-size: 0.6em; color: var(--r); margin-bottom: 0.8em; }
  .ftext.burn { color: #E07A3A; font-size: 0.8em; }
  .ftext.status { color: var(--sand); font-size: 0.8em; }
  .pip { display: block; width: calc(var(--u) * 5); height: calc(var(--u) * 8); background: var(--choc); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .pip.full { background: var(--sand); }
  .hpwrap { display: flex; align-items: center; gap: calc(var(--u) * 5); }
  .hp { position: relative; width: calc(var(--u) * 120); height: calc(var(--u) * 7); background: var(--onyx); }
  .hp-lag, .hp-fill, #boss .lag, #boss .fill { position: absolute; left: 0; top: 0; bottom: 0; }
  .hp-lag, #boss .lag { background: var(--sand); opacity: 0.75; }
  .hp-fill, #boss .fill { background: var(--crimson); box-shadow: inset 0 var(--u) 0 rgba(255, 255, 255, 0.2), inset 0 calc(var(--u) * -2) 0 rgba(0, 0, 0, 0.3); }
  .hp-text { font-size: 1.1em; }
  .hp-text .dim { font-size: 0.7em; }
  .res { position: absolute; right: calc(var(--u) * 10); top: calc(var(--u) * 8); display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 3); }
  .res small { font-size: 0.6em; color: var(--oak); margin-left: 0.5em; }
  .res .depth { color: var(--oak); font-size: 0.7em; }
  .ico { width: calc(var(--u) * 8); height: calc(var(--u) * 4); margin-left: calc(var(--u) * 2); color: var(--oak); }
  .slots { position: absolute; left: calc(var(--u) * 10); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: calc(var(--u) * 6); }
  .slots .slot {
    position: relative; width: calc(var(--u) * 13); height: calc(var(--u) * 13); transform: rotate(45deg);
    background: var(--onyx); border: var(--u) solid var(--c); box-shadow: 0 0 calc(var(--u) * 4) var(--c);
  }
  .slots .slot b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform: rotate(-45deg); color: var(--c); font-weight: normal; }
  .slots .slot i { position: absolute; right: calc(var(--u) * -4); bottom: calc(var(--u) * -4); transform: rotate(-45deg); font-style: normal; font-size: 0.6em; color: var(--sand); }
  #boss { position: fixed; top: calc(var(--u) * 10); left: 50%; transform: translateX(-50%); width: min(60vw, calc(var(--u) * 200)); text-align: center; z-index: 3; pointer-events: none; text-shadow: var(--u) var(--u) 0 var(--onyx); }
  #boss .name { margin-bottom: calc(var(--u) * 4); letter-spacing: 0.15em; }
  #boss .bar { position: relative; height: calc(var(--u) * 5); background: var(--onyx); }
  #bars { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .ebar { position: absolute; left: 0; top: 0; width: calc(var(--u) * 14); height: calc(var(--u) * 2); background: var(--onyx); box-shadow: 0 0 0 var(--u) var(--onyx); }
  .ebar.big { width: calc(var(--u) * 22); }
  .ebar i { display: block; height: 100%; background: var(--crimson); }
  .move { display: flex; align-items: center; margin: 0.5em 0; font-size: 0.75em; text-align: left; }
  .move small { display: block; color: var(--oak); font-size: 0.8em; }
  .moves { text-align: left; }

  #prompt {
    position: fixed; left: 50%; bottom: 20%; transform: translateX(-50%); z-index: 3; white-space: nowrap;
    padding: calc(var(--u) * 2) calc(var(--u) * 4); border-width: var(--u); background: rgba(19, 21, 21, 0.85); font-size: 0.9em;
  }
  #banner {
    position: fixed; left: 0; right: 0; top: 16%; text-align: center; z-index: 3; pointer-events: none;
    opacity: 0; transition: opacity 0.4s; text-shadow: var(--u) var(--u) 0 var(--onyx);
  }
  #banner.show { opacity: 1; }
  #banner h1 { margin: 0; font-size: 2.4em; font-weight: normal; }
  #banner p { margin: 0.8em 0 0; color: var(--oak); }

  #screen {
    position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 6); background: rgba(19, 21, 21, 0.72); text-align: center; padding: calc(var(--u) * 8);
  }
  #screen h1 { margin: 0; font-size: 3em; font-weight: normal; text-shadow: calc(var(--u) * 2) calc(var(--u) * 2) 0 var(--choc); }
  #screen h2 { margin: 0; font-size: 1.6em; font-weight: normal; }
  .tag { color: var(--oak); font-style: italic; }
  .cards { display: flex; gap: calc(var(--u) * 5); flex-wrap: wrap; justify-content: center; max-width: 100%; }
  .card {
    width: calc(var(--u) * 92); min-height: calc(var(--u) * 92); text-align: left; background: var(--onyx);
    border: var(--u) solid var(--choc); padding: calc(var(--u) * 5); opacity: 0.55;
  }
  .card.sel { border-color: var(--sand); opacity: 1; transform: translateY(calc(var(--u) * -3)); }
  .card h3 { margin: 0 0 0.6em; font-size: 1.2em; font-weight: normal; }
  .card p { margin: 0.5em 0; font-size: 0.75em; color: var(--oak); }
  .card .stat { font-size: 0.7em; color: var(--sand); }
  .list { display: flex; flex-direction: column; gap: calc(var(--u) * 2); min-width: calc(var(--u) * 180); }
  .item { display: flex; justify-content: space-between; gap: 2em; padding: calc(var(--u) * 3) calc(var(--u) * 4); border: var(--u) solid transparent; text-align: left; }
  .item.sel { border-color: var(--sand); background: var(--onyx); }
  .item small { display: block; color: var(--oak); font-size: 0.7em; }
  .hints { color: var(--oak); font-size: 0.8em; display: flex; gap: 2em; flex-wrap: wrap; justify-content: center; }

  #fade {
    position: fixed; inset: 0; background: var(--onyx); z-index: 5; opacity: 1; pointer-events: none; transition: opacity 0.25s;
    display: flex; align-items: center; justify-content: center; color: var(--oak);
  }
  #fade.clear { opacity: 0; }
  #nofile { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2em; background: var(--onyx); }

  /* ---- menus ---- */
  [data-sel], .tab { cursor: pointer; }
  /* home: left-aligned over the torchlit room; a keyhole marks where you are */
  #screen[data-view="home"] {
    align-items: flex-start; text-align: left; padding-left: calc(var(--u) * 28);
    background: linear-gradient(90deg, rgba(19, 21, 21, 0.94) 0%, rgba(19, 21, 21, 0.6) 42%, rgba(19, 21, 21, 0) 78%);
  }
  .home .logo { font-size: 3.4em; margin: 0; font-weight: normal; text-shadow: calc(var(--u) * 2) calc(var(--u) * 2) 0 var(--choc); }
  .home .tag { margin: 0.8em 0 2.6em; }
  .home-menu { display: flex; flex-direction: column; gap: calc(var(--u) * 6); }
  .home-item { display: flex; align-items: center; gap: calc(var(--u) * 4); font-size: 1.5em; color: var(--oak); opacity: 0.55; transition: transform 0.12s, opacity 0.12s; }
  .home-item .keyhole { width: calc(var(--u) * 5); height: calc(var(--u) * 8); color: var(--sand); visibility: hidden; }
  .home-item.sel { opacity: 1; color: var(--sand); transform: translateX(calc(var(--u) * 3)); }
  .home-item.sel .keyhole { visibility: visible; }
  .home .record { margin-top: 3.2em; font-size: 0.7em; color: var(--oak); opacity: 0.8; }
  .hints.corner { position: absolute; right: calc(var(--u) * 10); bottom: calc(var(--u) * 10); }

  /* play: three red cards with a scene from the game; the third is locked */
  .pcards { display: flex; gap: calc(var(--u) * 8); justify-content: center; flex-wrap: wrap; }
  .pcard {
    width: calc(var(--u) * 92); background: var(--choc); padding: calc(var(--u) * 3); text-align: left;
    box-shadow: 0 0 0 var(--u) var(--onyx), 0 0 0 calc(var(--u) * 2) var(--crimson);
    filter: brightness(0.75) saturate(0.9); transition: filter 0.15s, transform 0.15s;
  }
  .pcard.sel {
    filter: none; transform: translateY(calc(var(--u) * -3));
    box-shadow: 0 0 0 var(--u) var(--onyx), 0 0 0 calc(var(--u) * 2) var(--sand), 0 0 calc(var(--u) * 14) rgba(155, 28, 28, 0.6);
  }
  .pcard .art { position: relative; aspect-ratio: 300 / 220; background: var(--onyx); overflow: hidden; }
  .pcard .art img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
  .pcard.locked .art img { filter: grayscale(0.7) brightness(0.6); }
  .pcard .pbody { padding: calc(var(--u) * 4) calc(var(--u) * 2) calc(var(--u) * 2); }
  .pcard h3 { margin: 0 0 0.5em; font-size: 1.1em; font-weight: normal; color: var(--sand); }
  .pcard p { margin: 0; font-size: 0.62em; line-height: 1.7; color: var(--oak); }
  .pcard .done { margin-top: 0.6em; color: var(--sand); }
  .padlock {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1;
    width: calc(var(--u) * 16); height: calc(var(--u) * 16); background: var(--choc);
    box-shadow: 0 0 0 var(--u) var(--sand); display: flex; align-items: center; justify-content: center;
  }
  .padlock .keyhole { width: calc(var(--u) * 4); height: calc(var(--u) * 7); color: var(--onyx); }

  /* home extras: the keyhole crest, what the selected item does, and credits */
  .home .crest { width: calc(var(--u) * 16); height: calc(var(--u) * 16); margin-bottom: calc(var(--u) * 5); background: var(--choc); box-shadow: 0 0 0 var(--u) var(--sand); display: flex; align-items: center; justify-content: center; }
  .home .crest .keyhole { width: calc(var(--u) * 4); height: calc(var(--u) * 7); color: var(--onyx); }
  .home .home-desc { margin: calc(var(--u) * 6) 0 0; min-height: 1.8em; font-size: 0.7em; color: var(--oak); }
  .credits { position: absolute; left: calc(var(--u) * 28); bottom: calc(var(--u) * 10); margin: 0; font-size: 0.55em; color: var(--oak); opacity: 0.6; }

  /* codex pictures */
  .entry img { display: block; image-rendering: pixelated; margin-bottom: calc(var(--u) * 3); }
  .entry img.portrait { width: calc(var(--u) * 40); float: right; margin-left: calc(var(--u) * 3); }
  .entry img.wide { width: 100%; }

  /* settings */
  .settings { width: min(92vw, calc(var(--u) * 250)); max-height: 64vh; overflow-y: auto; }
  .settings .group { margin: calc(var(--u) * 5) 0 calc(var(--u) * 1); padding-left: calc(var(--u) * 4); font-size: 0.7em; color: var(--oak); opacity: 0.8; }
  .settings .group:first-child { margin-top: 0; }
  .settings .val { display: flex; align-items: center; gap: calc(var(--u) * 3); white-space: nowrap; }
  .settings .bar { display: inline-block; width: calc(var(--u) * 40); height: calc(var(--u) * 3); background: var(--onyx); box-shadow: 0 0 0 var(--u) var(--choc); }
  .settings .bar i { display: block; height: 100%; background: var(--sand); }
  .settings .pad { margin-left: calc(var(--u) * 5); color: var(--oak); }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* codex */
  .tabs { display: flex; gap: calc(var(--u) * 3); flex-wrap: wrap; justify-content: center; }
  .tab { padding: calc(var(--u) * 2) calc(var(--u) * 4); border: var(--u) solid transparent; color: var(--oak); font-size: 0.8em; }
  .tab.sel { border-color: var(--sand); color: var(--sand); }
  .codex {
    width: min(94vw, calc(var(--u) * 280)); max-height: 58vh; overflow-y: auto; text-align: left;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--u) * 120), 1fr)); gap: calc(var(--u) * 6);
  }
  .entry { border-left: calc(var(--u) * 2) solid var(--c, var(--choc)); padding-left: calc(var(--u) * 4); }
  .entry h3 { margin: 0 0 0.5em; font-size: 0.85em; font-weight: normal; color: var(--c, var(--sand)); }
  .entry p, .entry li, .entry dd, .entry dt { font-size: 0.6em; line-height: 1.8; color: var(--oak); }
  .entry dt { margin-top: 0.5em; color: var(--sand); }
  .entry dd { margin: 0; }
  .entry ul { margin: 0.4em 0; padding-left: 1.1em; }
  .entry b { font-weight: normal; color: var(--sand); }

  /* tutorial steps */
  #tutorial {
    position: fixed; top: calc(var(--u) * 6); left: 50%; transform: translateX(-50%); z-index: 3; pointer-events: none;
    width: min(90vw, calc(var(--u) * 220)); padding: calc(var(--u) * 4) calc(var(--u) * 6); text-align: center;
    background: rgba(19, 21, 21, 0.9); border: var(--u) solid var(--choc);
  }
  #tutorial .step { font-size: 0.7em; color: var(--oak); }
  /* Adventure's story lines */
  #talk {
    position: fixed; left: 50%; bottom: calc(var(--u) * 14); transform: translateX(-50%); z-index: 4; pointer-events: none;
    width: min(92vw, calc(var(--u) * 240)); padding: calc(var(--u) * 5) calc(var(--u) * 7); background: rgba(19, 21, 21, 0.92); border: var(--u) solid var(--choc);
  }
  #talk .who { color: var(--sand); font-size: 0.75em; margin-bottom: 0.6em; }
  #talk p { margin: 0; font-size: 0.8em; line-height: 1.8; color: var(--oak); }
  #talk .next { position: absolute; right: calc(var(--u) * 5); bottom: calc(var(--u) * 4); }
  #hud.noxp .xpwrap, #hud.noxp .lives { display: none; }
  /* in the tutorial: no lives (it gives 99), Ash, level or XP; health only in the fight step */
  #hud.tut .lives, #hud.tut .res, #hud.tut .xpwrap, #hud.tut:not(.tut-fight) .hpwrap { display: none; }
  #tutorial p { margin: 0.6em 0 0.8em; font-size: 0.8em; line-height: 1.8; }
  #tutorial .bar { height: calc(var(--u) * 2); background: var(--onyx); box-shadow: 0 0 0 var(--u) var(--choc); }
  #tutorial .bar i { display: block; height: 100%; background: var(--sand); transition: width 0.2s; }
  /* ---- phones ---- */
  /* touch controls: a stick that appears under your left thumb, and diamond buttons like the HUD's pips */
  #touch { position: fixed; inset: 0; z-index: 3; pointer-events: none; font-size: 9px; }
  #touch .zone { position: absolute; left: 0; top: 0; bottom: 0; width: 48%; pointer-events: auto; }
  #touch .stick {
    position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    background: rgba(19, 21, 21, 0.45); box-shadow: 0 0 0 2px var(--choc), 0 0 0 4px rgba(19, 21, 21, 0.6);
  }
  #touch .stick i { position: absolute; left: 32px; top: 32px; width: 48px; height: 48px; border-radius: 50%; background: var(--sand); opacity: 0.85; }
  /* --x/--y place a button's centre from the bottom-right corner, --s is its size */
  #touch .tb {
    --s: 56px; position: absolute; width: var(--s); height: var(--s); right: calc(var(--x) - var(--s) / 2); bottom: calc(var(--y) - var(--s) / 2);
    transform: rotate(45deg); pointer-events: auto;
    display: flex; align-items: center; justify-content: center; background: rgba(19, 21, 21, 0.7);
    box-shadow: 0 0 0 2px var(--choc), 0 0 0 4px rgba(19, 21, 21, 0.7); color: var(--sand); opacity: 0.85;
  }
  #touch .tb span { transform: rotate(-45deg); text-shadow: 1px 1px 0 var(--onyx); }
  #touch .tb.on { background: var(--choc); box-shadow: 0 0 0 2px var(--sand), 0 0 0 4px var(--onyx); opacity: 1; }
  #touch .attack { --s: 84px; --x: 84px; --y: 84px; background: rgba(110, 35, 35, 0.75); }
  #touch .dash { --x: 196px; --y: 66px; }
  #touch .special { --x: 66px; --y: 196px; }
  #touch .cast { --s: 50px; --x: 172px; --y: 172px; }
  #touch .interact { --x: 300px; --y: 66px; display: none; }
  #touch.use .interact { display: flex; }
  #touch .pause, #touch .craft { right: auto; bottom: auto; left: calc(var(--x) - var(--s) / 2); top: calc(var(--y) - var(--s) / 2); }
  #touch .pause { --s: 36px; --x: 30px; --y: 30px; }
  #touch .craft { --s: 46px; --x: 96px; --y: 34px; display: none; }
  #touch.wild .craft { display: flex; }
  #touch.grounded .special, #touch.grounded .cast { display: none; }
  /* the use prompt sits above the thumbs; hints with one button become tappable chips */
  .touch-on #prompt { bottom: 34%; }
  .touch-on .hints > span { padding: 0.5em 0.9em; border: var(--u) solid var(--choc); background: var(--onyx); }
  .touch-on .hints .btn:only-of-type { display: none; }
  .touch-on #talk { pointer-events: auto; }
  /* held upright: ask for sideways */
  #rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 32px; text-align: center; background: var(--onyx); color: var(--sand); font-size: 12px; line-height: 2;
    }
    #rotate .phone { width: 44px; height: 76px; box-shadow: 0 0 0 3px var(--sand); animation: turn 2.4s steps(1) infinite; }
    @keyframes turn { 50% { transform: rotate(90deg); } }
  }
  /* short screens (phones on their side): smaller menu cards so a row of them fits */
  @media (max-height: 520px) {
    /* cards share one row, shrinking on narrow phones; anything still too tall scrolls */
    .pcards, .cards { gap: calc(var(--u) * 4); flex-wrap: nowrap; width: 100%; }
    .pcard, .card { flex: 1 1 0; min-width: 0; max-width: calc(var(--u) * 70); }
    #screen { justify-content: safe center; overflow-y: auto; touch-action: pan-y; }
    .pcard p, .card p { font-size: 0.7em; }
    .pcard .art { aspect-ratio: 5 / 2; }
    .card { min-height: 0; }
    .card.boon { min-height: calc(var(--u) * 64); }
    #screen { gap: calc(var(--u) * 4); padding: calc(var(--u) * 5); }
    #screen h1 { font-size: 2.2em; }
    #banner { top: 22%; }
    #banner h1 { font-size: 1.6em; }
    .home .logo { font-size: 2.6em; }
    .home .tag { margin: 0.6em 0 1.4em; }
    .home .record { margin-top: 1.6em; }
  }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .home-item, .door, #tutorial .bar i { transition: none; } .blink { animation: none; } }
</style>
